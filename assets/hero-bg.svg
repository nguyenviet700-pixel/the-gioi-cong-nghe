<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="0.55" stop-color="#12386b"/>
      <stop offset="1" stop-color="#0d5c7a"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#5ec8ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <!-- bánh răng 12 răng -->
    <g id="gear">
      <circle r="62" fill="none" stroke="#7fd6ff" stroke-width="10"/>
      <circle r="22" fill="none" stroke="#7fd6ff" stroke-width="8"/>
      <g stroke="#7fd6ff" stroke-width="16" stroke-linecap="round">
        <path d="M0 -70V-86M0 70V86M-70 0H-86M70 0H86M49.5 -49.5L60.8 -60.8M-49.5 49.5L-60.8 60.8M49.5 49.5L60.8 60.8M-49.5 -49.5L-60.8 -60.8M26 -65L31 -80M-26 65L-31 80M65 26L80 31M-65 -26L-80 -31"/>
      </g>
      <path d="M0 -22V-62M0 22V62M-22 0H-62M22 0H62" stroke="#7fd6ff" stroke-width="5"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- bánh răng -->
  <use href="#gear" transform="translate(1330 190) scale(2.2)" opacity="0.16"/>
  <use href="#gear" transform="translate(1050 470) scale(1.3)" opacity="0.14"/>
  <use href="#gear" transform="translate(170 760) scale(1.8)" opacity="0.12"/>
  <use href="#gear" transform="translate(470 880) scale(0.9)" opacity="0.12"/>

  <!-- đường mạch điện tử -->
  <g fill="none" stroke="#4fd1ff" stroke-width="3" stroke-opacity="0.35" stroke-linejoin="round">
    <path d="M0 140H220L280 200H520L580 140H820"/>
    <path d="M0 300H140L200 360H460"/>
    <path d="M700 900V780L760 720H1100L1160 660H1600"/>
    <path d="M1600 560H1400L1340 620H1180"/>
    <path d="M300 0V90L360 150"/>
    <path d="M900 0V70L960 130H1250L1310 70V0"/>
  </g>
  <g fill="#7fe3ff" fill-opacity="0.75">
    <circle cx="820" cy="140" r="8"/><circle cx="460" cy="360" r="8"/><circle cx="1600" cy="660" r="0"/>
    <circle cx="1180" cy="620" r="8"/><circle cx="360" cy="150" r="8"/><circle cx="1250" cy="130" r="8"/>
    <circle cx="520" cy="200" r="6"/><circle cx="1100" cy="720" r="6"/><circle cx="220" cy="140" r="6"/>
  </g>

  <!-- chip vi xử lý -->
  <g transform="translate(1180 700)" opacity="0.5" stroke="#7fd6ff" fill="none" stroke-width="4">
    <rect x="0" y="0" width="130" height="130" rx="10"/>
    <rect x="35" y="35" width="60" height="60" rx="6" fill="#7fd6ff" fill-opacity="0.2"/>
    <path d="M25 0V-26M55 0V-26M85 0V-26M105 0V-26M25 130V156M55 130V156M85 130V156M105 130V156M0 25H-26M0 55H-26M0 85H-26M0 105H-26M130 25H156M130 55H156M130 85H156M130 105H156"/>
  </g>

  <!-- mạch rau/cây: biểu tượng công nghệ nông nghiệp -->
  <g transform="translate(120 170)" opacity="0.4" stroke="#8cf2b6" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M0 120V30"/><path d="M0 70C-40 70 -50 30 -50 10C-10 10 0 40 0 70Z"/><path d="M0 50C40 50 50 10 50 -10C10 -10 0 20 0 50Z"/>
  </g>
</svg>
